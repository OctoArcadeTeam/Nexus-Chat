<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel Chat App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen overflow-hidden flex flex-col font-sans">

    <!-- AUTHENTICATION CONTAINER -->
    <div id="auth-screen" class="fixed inset-0 bg-gray-900 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-800 border border-gray-700 p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </div>
                <h2 id="auth-title" class="text-2xl font-bold">Sign In to Account</h2>
                <p class="text-gray-400 text-sm mt-1">Enter your details to access the global chat</p>
            </div>

            <!-- Global Error Banner -->
            <div id="auth-error" class="hidden mb-4 p-3 bg-red-900/50 border border-red-500 text-red-200 text-xs rounded-lg text-center break-words"></div>

            <form id="auth-form" class="space-y-4">
                <div id="display-name-group" class="hidden">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Display Name</label>
                    <input type="text" id="auth-display-name" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="Alex Dev">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="name@example.com">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="auth-password" required minlength="6" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="••••••••">
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
                    <span id="btn-text">Sign In</span>
                    <div id="auth-spinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-400">
                <span id="toggle-text">Don't have an account?</span>
                <button id="toggle-auth-mode" class="text-blue-400 hover:underline font-medium ml-1">Create Account</button>
            </div>
        </div>
    </div>

    <!-- MAIN CHAT APP CONTAINER -->
    <div id="app-screen" class="hidden flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col">
            <!-- Header -->
            <div class="p-4 border-b border-gray-700 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm" id="user-avatar">?</div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-semibold truncate" id="user-display">Loading...</p>
                        <p class="text-xs text-emerald-400 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Online</p>
                    </div>
                </div>
                <button id="logout-btn" title="Sign Out" class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>

            <!-- Channels -->
            <div class="p-4 flex-1 overflow-y-auto custom-scrollbar">
                <p class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Channels</p>
                <div class="space-y-1">
                    <button class="w-full text-left px-3 py-2 rounded-lg bg-gray-700 text-white font-medium text-sm flex items-center gap-2"># general</button>
                </div>
            </div>
        </div>

        <!-- Chat Main View -->
        <div class="flex-1 flex flex-col bg-gray-900">
            <!-- Chat Header -->
            <div class="p-4 bg-gray-800 border-b border-gray-700 flex items-center justify-between">
                <div>
                    <h1 class="text-lg font-bold text-white"># general</h1>
                    <p class="text-xs text-gray-400">Public channel for community discussions</p>
                </div>
            </div>

            <!-- Message History Area -->
            <div id="messages-container" class="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-4">
                <div class="text-center text-gray-500 text-xs py-4">Loading conversation...</div>
            </div>

            <!-- Input Box -->
            <div class="p-4 bg-gray-800 border-t border-gray-700">
                <form id="message-form" class="flex gap-2">
                    <input type="text" id="message-input" autocomplete="off" class="flex-1 bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Type a message in #general...">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-1">
                        Send
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modular Import -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            updateProfile, 
            onAuthStateChanged, 
            signOut 
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            orderBy, 
            limit, 
            onSnapshot, 
            serverTimestamp 
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Corrected Firebase Config for Web Apps
        const firebaseConfig = {
            apiKey: "AIzaSyAuWzbauhK86FC-yc8RkcXftQAhdHexrpE",
            authDomain: "bookmarklet-backend.firebaseapp.com", // Formed using project_id
            projectId: "bookmarklet-backend",
            storageBucket: "bookmarklet-backend.firebasestorage.app",
            messagingSenderId: "447001590035",
            appId: "1:447001590035:ios:c13149711eac0631f702e6"
        };

        // Initialize Firebase Services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State variables
        let isSignUp = false;

        // DOM Elements
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authForm = document.getElementById('auth-form');
        const authTitle = document.getElementById('auth-title');
        const displayNameGroup = document.getElementById('display-name-group');
        const displayNameInput = document.getElementById('auth-display-name');
        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        const toggleAuthBtn = document.getElementById('toggle-auth-mode');
        const toggleText = document.getElementById('toggle-text');
        const authError = document.getElementById('auth-error');
        const btnText = document.getElementById('btn-text');
        const authSpinner = document.getElementById('auth-spinner');
        const userDisplay = document.getElementById('user-display');
        const userAvatar = document.getElementById('user-avatar');
        const logoutBtn = document.getElementById('logout-btn');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const messagesContainer = document.getElementById('messages-container');

        // Toggle Sign In / Sign Up View
        toggleAuthBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            authError.classList.add('hidden');
            if (isSignUp) {
                authTitle.textContent = "Create an Account";
                displayNameGroup.classList.remove('hidden');
                btnText.textContent = "Register";
                toggleText.textContent = "Already have an account?";
                toggleAuthBtn.textContent = "Sign In";
            } else {
                authTitle.textContent = "Sign In to Account";
                displayNameGroup.classList.add('hidden');
                btnText.textContent = "Sign In";
                toggleText.textContent = "Don't have an account?";
                toggleAuthBtn.textContent = "Create Account";
            }
        });

        // Handle Authentication Form Submit
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            authSpinner.classList.remove('hidden');

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const displayName = displayNameInput.value.trim();

            try {
                if (isSignUp) {
                    if (!displayName) throw new Error("Please enter a display name.");
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(userCredential.user, { displayName });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                console.error("Auth Error:", err);
                let message = err.message;
                if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
                    message = "Invalid email or password.";
                } else if (err.code === 'auth/email-already-in-use') {
                    message = "An account with this email already exists.";
                } else if (err.code === 'auth/operation-not-allowed') {
                    message = "Email/Password auth is disabled in your Firebase console settings.";
                } else if (err.code === 'auth/unauthorized-domain') {
                    message = "This domain is not added to Firebase Authorized Domains.";
                }
                authError.textContent = message;
                authError.classList.remove('hidden');
            } finally {
                authSpinner.classList.add('hidden');
            }
        });

        // Listen for Authentication State Changes
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                const name = user.displayName || user.email.split('@')[0];
                userDisplay.textContent = name;
                userAvatar.textContent = name.charAt(0).toUpperCase();
                loadMessages();
            } else {
                appScreen.classList.add('hidden');
                authScreen.classList.remove('hidden');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => signOut(auth));

        // Load Real-time Messages from Firestore
        let unsubscribe = null;
        function loadMessages() {
            if (unsubscribe) unsubscribe();
            const q = query(collection(db, 'messages'), orderBy('timestamp', 'asc'), limit(100));
            
            unsubscribe = onSnapshot(q, (snapshot) => {
                messagesContainer.innerHTML = '';
                if (snapshot.empty) {
                    messagesContainer.innerHTML = '<div class="text-center text-gray-500 text-xs py-4">No messages yet. Say hi!</div>';
                    return;
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isSelf = auth.currentUser && auth.currentUser.uid === data.uid;
                    
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `flex gap-3 ${isSelf ? 'flex-row-reverse' : ''}`;
                    
                    const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Just now';
                    
                    msgDiv.innerHTML = `
                        <div class="w-8 h-8 rounded-full ${isSelf ? 'bg-blue-600' : 'bg-gray-700'} flex items-center justify-center font-bold text-xs shrink-0">
                            ${(data.senderName || '?').charAt(0).toUpperCase()}
                        </div>
                        <div class="max-w-[70%]">
                            <div class="flex items-center gap-2 mb-1 ${isSelf ? 'justify-end' : ''}">
                                <span class="text-xs font-semibold text-gray-300">${data.senderName || 'Anonymous'}</span>
                                <span class="text-[10px] text-gray-500">${time}</span>
                            </div>
                            <div class="p-3 rounded-2xl text-sm ${isSelf ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-gray-800 text-gray-200 border border-gray-700 rounded-tl-none'} shadow-sm">
                                ${escapeHtml(data.text || '')}
                            </div>
                        </div>
                    `;
                    messagesContainer.appendChild(msgDiv);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, (err) => {
                console.error("Firestore Error:", err);
                messagesContainer.innerHTML = `<div class="p-4 bg-red-900/30 text-red-400 text-xs text-center rounded-lg">Database access error: ${err.message}. Check your Firestore rules.</div>`;
            });
        }

        // Send Message
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !auth.currentUser) return;

            messageInput.value = '';
            try {
                await addDoc(collection(db, 'messages'), {
                    text: text,
                    uid: auth.currentUser.uid,
                    senderName: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
                    timestamp: serverTimestamp()
                });
            } catch (err) {
                console.error("Send message error:", err);
                alert("Failed to send message: " + err.message);
            }
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
